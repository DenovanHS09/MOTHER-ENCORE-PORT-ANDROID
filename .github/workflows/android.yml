name: android-debug
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Compilar en modo RELEASE (true) o DEBUG (false)"
        default: "true"
      lookahead:
        description: "Batching 2D: item_reordering_lookahead (4 = normal; prueba 32)"
        default: "4"
jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.6.2
    steps:
      - uses: actions/checkout@v4
      - name: Arreglar mayusculas
        run: perl fixcase.pl
      - name: Dividir hoja de la nube
        run: |
          apt-get update -qq && apt-get install -y -qq imagemagick
          cd "Graphics/Cutscenes/Mt Itoi Landscape"
          W=$(identify -format %w Mt_Itoi_Cloud.png)
          H=$(identify -format %h Mt_Itoi_Cloud.png)
          FW=$((W / 31))
          echo "hoja original: ${W}x${H}, cuadro: ${FW}x${H}"
          rm -f /tmp/cloud_*.png
          convert Mt_Itoi_Cloud.png -crop ${FW}x${H} +repage +adjoin /tmp/cloud_%02d.png
          N=$(ls /tmp/cloud_*.png | wc -l)
          echo "cuadros: $N"
          [ "$N" = "31" ] || { echo "ERROR: se esperaban 31 cuadros"; exit 1; }
          montage /tmp/cloud_*.png -tile 4x8 -geometry ${FW}x${H}+0+0 -background none PNG32:/tmp/cloud_grid_out.png
          mv /tmp/cloud_grid_out.png Mt_Itoi_Cloud.png
          identify Mt_Itoi_Cloud.png
          cd ../../..
          sed -i 's/hframes = 31/hframes = 4\nvframes = 8/' "Nodes/Reusables/Mt Itoi Cloud.tscn"
          grep -n "frames" "Nodes/Reusables/Mt Itoi Cloud.tscn"
          echo "=== Imagenes con ancho o alto mayor a 4096 ==="
          find . -type f -iname "*.png" -not -path "./.import/*" -not -path "./.git/*" -print0 | xargs -0 -r identify -format "%w %h %d/%f\n" 2>/dev/null | awk '$1 > 4096 || $2 > 4096' | sort -rn | head -40
      - name: Desactivar mouse emulado desde toque
        run: |
          if grep -q 'emulate_mouse_from_touch' project.godot; then
            sed -i 's|pointing/emulate_mouse_from_touch=.*|pointing/emulate_mouse_from_touch=false|' project.godot
          elif grep -q '^\[input_devices\]' project.godot; then
            sed -i 's|^\[input_devices\]|[input_devices]\n\npointing/emulate_mouse_from_touch=false|' project.godot
          else
            printf '\n[input_devices]\n\npointing/emulate_mouse_from_touch=false\n' >> project.godot
          fi
          grep -n -A3 'input_devices' project.godot
      - name: Ajustar batching 2D
        run: |
          LA="${{ github.event.inputs.lookahead }}"
          if [ -n "$LA" ] && [ "$LA" != "4" ]; then
            if grep -q 'item_reordering_lookahead' project.godot; then
              sed -i "s|batching/parameters/item_reordering_lookahead=.*|batching/parameters/item_reordering_lookahead=$LA|" project.godot
            else
              sed -i "s|^\[rendering\]|[rendering]\n\nbatching/parameters/item_reordering_lookahead=$LA|" project.godot
            fi
          fi
          grep -n -B1 -A2 'item_reordering' project.godot || echo "batching: valor por defecto (4)"
      - name: Plantillas de exportacion
        run: |
          DEST=$HOME/.local/share/godot/templates/3.6.2.stable
          mkdir -p $DEST
          SRC=$(find /root /usr /opt -type d -name "3.6.2*" -path "*templates*" 2>/dev/null | head -1)
          echo "SRC=$SRC"
          if [ -n "$SRC" ] && [ -f "$SRC/android_debug.apk" ]; then
            cp -r $SRC/. $DEST/
          else
            echo "Descargando plantillas oficiales..."
            wget -q -O /tmp/t.tpz https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_export_templates.tpz
            unzip -q /tmp/t.tpz -d /tmp/t
            cp -r /tmp/t/templates/. $DEST/
          fi
          ls $DEST | grep -i android
      - name: Importar recursos
        run: |
          godot -v --editor --quit || true
          godot -v --editor --quit || true
      - name: Configurar Android
        run: |
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $HOME/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          SETTINGS=$HOME/.config/godot/editor_settings-3.tres
          sed -i "s|export/android/java_sdk_path = \"\"|export/android/java_sdk_path = \"$JAVA_PATH\"|" $SETTINGS
          sed -i "s|export/android/android_sdk_path = \"\"|export/android/android_sdk_path = \"/usr/lib/android-sdk\"|" $SETTINGS
          sed -i "s|export/android/debug_keystore = \"\"|export/android/debug_keystore = \"$HOME/debug.keystore\"|" $SETTINGS
          grep -i "export/android" $SETTINGS
      - name: Exportar APK
        run: |
          mkdir -p build
          if [ "${{ github.event.inputs.release }}" = "true" ]; then
            echo "=== MODO RELEASE ==="
            sed -i "s|keystore/release=\"\"|keystore/release=\"$HOME/debug.keystore\"|; s|keystore/release_user=\"\"|keystore/release_user=\"androiddebugkey\"|; s|keystore/release_password=\"\"|keystore/release_password=\"android\"|" export_presets.cfg
            grep -n "keystore/release" export_presets.cfg
            godot -v --export "Android" build/mother-encore.apk 2>&1 | grep -v -e "VisualServer" -e "visual_server_raster" -e "Loading resource" -e "Cannot open file" -e "Failed loading resource" -e "load_interactive" -e "_load (core" | tail -60
          else
            echo "=== MODO DEBUG ==="
            godot -v --export-debug "Android" build/mother-encore.apk 2>&1 | grep -v -e "VisualServer" -e "visual_server_raster" -e "Loading resource" -e "Cannot open file" -e "Failed loading resource" -e "load_interactive" -e "_load (core" | tail -60
          fi
          ls -la build
          [ -f build/mother-encore.apk ] || { echo "ERROR: no se genero el APK"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/mother-encore.apk

          
